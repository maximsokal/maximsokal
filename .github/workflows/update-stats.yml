name: Update public GitHub profile stats weekly

on:
  schedule:
    - cron: '17 6 * * 1' # Monday 06:17 UTC; avoid top-of-hour delays.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-stats-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'maximsokal/maximsokal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify metrics updater
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Calculate public GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile_stats.py --owner maximsokal --readme README.md
      - name: Commit only if the numbers changed
        run: |
          if git diff --quiet -- README.md; then
            echo 'No metric changes; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: update weekly GitHub profile stats'
          git push
